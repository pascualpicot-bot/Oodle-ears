<script>
const panels=[p1,p2,p3];
document.querySelectorAll('.hotspot').forEach((b,i)=>b.onclick=()=>{
  const open=panels[i].classList.contains('open');
  panels.forEach(p=>p.classList.remove('open'));
  if(!open) panels[i].classList.add('open');
});
document.querySelectorAll('.png-card').forEach(b=>b.onclick=()=>{
  const a=document.createElement('a');
  a.href=b.dataset.download;
  a.download=b.dataset.download.split('/').pop();
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
